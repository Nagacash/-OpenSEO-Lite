        <h1>OpenSEO-Lite — MCP SEO tools for Claude, Cursor &amp; Hermes</h1>
        <p>
          OpenSEO-Lite is an agent-native SEO toolkit that gives language models real eyes on the live web.
          Run SERP search, on-page audits, full site audits, and AI visibility checks through the Model Context Protocol
          without Docker, without a database, and without a heavyweight CMS. Install with pip, start the MCP server,
          and connect Claude Desktop, Cursor, Hermes, or any FastMCP-compatible client.
        </p>
        <h2>What you can audit in one pass</h2>
        <p>
          The site audit skill fetches a public URL, scores technical SEO health out of 100, and returns prioritized fixes.
          It checks title tags, meta descriptions, heading structure, word count, internal and external links, image alt text,
          and heuristic Core Web Vitals estimates. Export results as JSON, Markdown, or plain text for client delivery.
          Page audit digs into a single URL. SERP search probes live result pages for a keyword and location.
          AI visibility estimates whether answer engines mention your brand and cite your domain.
        </p>
        <h2>Built for agents, not dashboards</h2>
        <p>
          Most SEO platforms bury insights behind logins and credit systems. OpenSEO-Lite is designed for agent workflows:
          structured JSON out, clear recommendations in plain language, and optional LLM summaries when you supply an
          OpenRouter, NVIDIA NIM, or OpenAI key. Use free NIM endpoints such as Google Gemma 4 31B or Nemotron Lightning
          for executive summaries, or keep the deterministic rule-based advisor when no key is set.
        </p>
        <h2>Get started</h2>
        <p>
          Clone the repository, install Python requirements, and run the MCP server locally. Or open the web playground
          to paste a URL and run a site audit in the browser. Connect guides cover Claude, Cursor, Hermes, Grok, and
          NVIDIA NIM setup. Security defaults include SSRF blocking for private networks and client-side API key storage
          that never writes secrets to a third-party database.
        </p>
